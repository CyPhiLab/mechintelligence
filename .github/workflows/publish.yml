name: Publish

# main is the live book and deploys. drafts holds work in progress: pushes there run the
# tests and the render (the rendered site is kept as a downloadable artifact) but never
# deploy. A release is a pull request from drafts to main, merged after review.
on:
  push:
    branches: [main, drafts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Test every number in the book
        run: uv run pytest -q
      # The setup action authenticates its GitHub release lookups with the workflow token;
      # `quarto install tinytex` alone hits the anonymous API rate limit on shared runners.
      - name: Install Quarto and TinyTeX for the PDF
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render website and PDF
        run: uv run quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
